name: scenarios-conductor

services:
  app:
    container_name: scenarios_conductor
    image: ${IMAGE}
    restart: always
    ports:
      - ${PROMETHEUS_PORT_MAPPING:-9000:9000}
    environment:
      - CONFIG_PATH=/app/config.yaml
    volumes:
      - type: bind
        source: ${CADASTRE_HOST_PATH:?Set CADASTRE_HOST_PATH to the existing GeoPackage on the host}
        target: /data/cadastre.gpkg
        read_only: true
        bind:
          create_host_path: false
      - ${LOG_VOLUME:-/var/log/scenarios_conductor}:/app/logs
      - ${REAL_CONFIG_PATH}:/app/config.yaml:ro
    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "10"
    networks:
      - ${CUSTOM_NETWORK:-default}

networks:
  default:
